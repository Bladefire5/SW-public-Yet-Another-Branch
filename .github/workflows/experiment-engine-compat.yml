name: Experiment - Engine Compatibility

on:
  push:
    branches: [ Experiment ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and test Experiment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Spellward and pinned RobustToolbox
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show SDK and engine commit
        shell: bash
        run: |
          dotnet --info
          git -C RobustToolbox rev-parse HEAD

      - name: Restore
        run: dotnet restore

      # spellward start - keep compiler diagnostics readable and retain the full build log.
      - name: Build all projects
        id: build
        shell: bash
        run: dotnet build --configuration DebugOpt --no-restore /m -clp:ErrorsOnly '-flp:logfile=experiment-build.log;verbosity=normal'

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-build-log
          path: experiment-build.log
          if-no-files-found: ignore
      # spellward end

      # spellward start - run both suites after a successful build and retain their results.
      - name: Run unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj --logger 'trx;LogFileName=unit.trx' --results-directory TestResults/unit -- NUnit.ConsoleOut=0

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-unit-test-results
          path: TestResults/unit/**/*.trx
          if-no-files-found: ignore

      - name: Run engine compatibility regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:DOTNET_gcServer=1
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter 'FullyQualifiedName~Content.IntegrationTests.Tests.Imperial.EngineCompatibility' --logger 'trx;LogFileName=compatibility.trx' --results-directory TestResults/compatibility -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

      - name: Upload compatibility test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-compatibility-test-results
          path: TestResults/compatibility/**/*.trx
          if-no-files-found: ignore

      - name: Run integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:DOTNET_gcServer=1
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter 'FullyQualifiedName!~Content.IntegrationTests.Tests.Imperial.EngineCompatibility' --logger 'trx;LogFileName=integration.trx' --results-directory TestResults/integration -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
      # spellward end
