# Novice

- type: entity
  id: MedievalNoviceDash
  name: Dash
  description: Quickly move toward the selected location.
  components:
  - type: Action
    useDelay: 10

  - type: TargetAction
    range: 10
    checkCanAccess: false

  - type: WorldTargetAction
    event: !type:FullMovementEvent

  - type: FullMovement
    speed: 10
    acceleration: 20
    deceleration: 25
    arrivalDistance: 0.2