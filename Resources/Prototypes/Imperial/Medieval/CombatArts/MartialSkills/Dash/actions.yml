# Novice

- type: entity
  id: MedievalNoviceDash
  name: Dash
  description: Quickly move toward the selected location.
  components:
  - type: Action
    useDelay: 10
  - type: TargetAction
    range: 4
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:FullMovementEvent
  - type: FullMovement
    speed: 100
    acceleration: 0
    deceleration: 0
    arrivalDistance: 0.2
  - type: MedievalPhysical
    staminaCost: 50