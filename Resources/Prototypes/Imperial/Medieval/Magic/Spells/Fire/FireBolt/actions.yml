# Fire Bolt I-IV and the mutually exclusive Large Firebolt I-III. RSI paths are placeholders.
- type: entity
  id: MedievalActionFireBoltBase
  components:
    - type: ManaDrainSpell
      manaDrain: 15
      canUseWithoutMana: true
      manaLowMessage: medieval-spell-speach-not-enough-mana-fire-spell
      damageOnUseWithoutMana:
        groups:
          Burn: 5
    - type: SpellCastEffect
      effectProto: FireBoltSpellCastEffect
    - type: MedievalTargetSpell
    - type: Action
      useDelay: 4
      itemIconStyle: BigAction
      sound: !type:SoundPathSpecifier
        path: /Audio/Imperial/Medieval/arrow_cast.ogg
      icon:
        sprite: Imperial/Medieval/Magic/Fire/FireBolt/icons.rsi
        state: fire-beginner
    - type: TargetAction
      checkCanAccess: false
      range: 60
  abstract: true

- type: entity
  id: MedievalActionFireBoltTier1
  name: medieval-store-spells-fire-bolt-tier1-name
  description: medieval-store-spells-fire-bolt-tier1-desc
  components:
    - type: ManaDrainSpell
      manaDrain: 15
      canUseWithoutMana: true
      manaLowMessage: medieval-spell-speach-not-enough-mana-fire-spell
      damageOnUseWithoutMana:
        groups:
          Burn: 5
    - type: MedievalTargetSpell
    - type: Action
      useDelay: 4
      itemIconStyle: BigAction
      sound: !type:SoundPathSpecifier
        path: /Audio/Imperial/Medieval/arrow_cast.ogg
      icon:
        sprite: Imperial/Medieval/Magic/Fire/FireBolt/icons.rsi
        state: fire-beginner
    - type: TargetAction
      checkCanAccess: false
      range: 60
    - type: WorldTargetAction
      event: !type:MedievalProjectileSpellEvent
        projectilePrototype:
          0: MedievalProjectileFireBoltTier1
        projectileSpeed: 15
        speechPoints:
          0:
            speech: medieval-spell-speech-fire-bolt
            color: '#FF5900'
            hideChat: true
    - type: CastTraining
      trainingResults:
        - !type:AddMagicEssence
          essenceAddProbability: 0.0002
          bonusAddProbability: 1
          addedEssences:
            MagicMedievalFire: 1
          bonusEssences:
            MagicMedievalFire: 1
    - type: DamageTraining
      trainingResults:
        - !type:AddMagicEssence
          conditions:
            - !type:TargetContainsComponentsCondition
              componentsWhitelist:
                - type: TrainingTarget
          addedEssences:
            MagicMedievalFire: 1
          essenceAddProbability: 0.0009
        - !type:AddMagicEssence
          conditions:
            - !type:TargetContainsComponentsCondition
              componentsWhitelist:
                - type: MobState
            - !type:MagicTargetMobStateCondition
              allowedState: Alive
          addedEssences:
            MagicMedievalFire: 1
          essenceAddProbability: 0.0007
    - type: ActionUpgrade
      effectedLevels:
        2: MedievalActionFireBoltTier2
        3: MedievalActionFireBoltTier3
        4: MedievalActionFireBoltTier4
    - type: SpellCastEffect
      effectProto: FireBoltSpellCastEffect
  parent: MedievalActionFireBoltBase

