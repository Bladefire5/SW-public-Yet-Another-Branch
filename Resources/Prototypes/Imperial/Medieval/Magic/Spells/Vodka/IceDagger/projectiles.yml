# Beginner

- type: entity
  name: IceDagger
  parent: [ BaseKnife, BaseDaggerCharged ]
  id: IceDaggerBeginner
  description: Hurry up! It will melt soon
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Melee/ice_dagger_beginner.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Imperial/Medieval/Melee/ice_dagger_beginner.rsi
  # spellward start - parryChanse is ignored by MeleeParry; keep the active timing parry.
  - type: MeleeParry
  # spellward end
  # spellward start - half Cold; weaker than the rebalanced iron dagger.
  - type: MeleeWeapon
    attackRate: 1.34
    clickDamageModifier: 1
    range: 1
    damage:
      types:
        Slash: 2.5
        Cold: 2.5
        ParryAble: 1
    resetOnHandSelected: false
  # spellward end
  - type: EmbeddableProjectile
    offset: 0.15,0.15
    removalTime: 2
  - type: ThrowingAngle
    angle: 225
  - type: Tag
    tags:
    - Knife
  # spellward start - half of thrown damage is Cold; no thrown knockback.
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 5
        Cold: 5
  # MeleeThrowOnHit removed to prevent knockback on melee and throw impacts.
  - type: SummonedIceDagger
    hitsRemaining: 5
  - type: PoiseDamage
    poiseDamage: 1
  # spellward end
  - type: StaminaDamageOnHit
    damage: 2 #2 dagger, 5 spear, 4 sword, 5 mace, 8 halberd, 6 sekir, 18 hammer
  - type: TimedDespawn
    lifetime: 15
  - type: SpawnOnDespawn
    prototype: IceBarrierParticles

