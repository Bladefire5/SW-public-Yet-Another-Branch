
- type: entity
  name: Chargebow
  parent: BaseBow
  abstract: true
  id: BaseMedievalBowCharged
  components:
  - type: MedievalBowCharge
    baseBowDamage: 10
    baseBluntImpact: 2
    basePoiseDamage: 10
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          components:
          - PoiseArchery
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 1
    range: 1.2
    clickDamageModifier: 1
    damage:
      types:
        Blunt: 3
    animation: WeaponArcPunch
    soundHit:
      collection: WeakHit
  - type: Gun
    projectileSpeed: 20


- type: entity
  id: MedievalBowImprovised
  parent: BaseMedievalBowCharged
  name: improvised shortbow
  components:
  - type: Gun
    defaultSpread: 10
  - type: Sprite
    layers:
    - state: unwielded
      map: [ base ]
    - state: unwielded-arrow
      map: [ arrow ]
      visible: false
    - state: unwielded-plunger
      map: [ plunger ]
      visible: false
  - type: Appearance
  - type: ItemMapper
    spriteLayers:
    - arrow
    - plunger
    mapLayers:
      arrow:
        whitelist:
          tags:
          - Arrow
      plunger:
        whitelist:
          tags:
          - Plunger
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        arrow:
          True: { state: wielded-arrow }
          False: { state: unwielded-arrow }
        plunger:
          True: { state: wielded-plunger }
          False: { state: unwielded-plunger }
        base:
          True: { state: wielded }
          False: { state: unwielded }
  - type: RDWeight
    value: 1.5

- type: entity
  name: bow
  parent: BaseMedievalBowCharged
  id: MedievalWeaponBow
  description: A portable anti-armour rifle. Fires armor piercing 14.5mm shells. Uses .60 anti-material ammo.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Gun/bow.rsi
  - type: Clothing
    sprite: Imperial/Medieval/Gun/bow.rsi
  - type: Gun
    resetOnHandSelected: false
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Imperial/Medieval/ES_Bow_Release_Arrow_-_SFX_Producer.ogg
    defaultSpread: 10

- type: entity
  name: bow
  parent: BaseMedievalBowCharged
  id: MedievalWeaponBowNecro
  description: A portable anti-armour rifle. Fires armor piercing 14.5mm shells. Uses .60 anti-material ammo.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Gun/necro_bow.rsi
  - type: Clothing
    sprite: Imperial/Medieval/Gun/necro_bow.rsi
  - type: Gun
    resetOnHandSelected: false
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Imperial/Medieval/ES_Bow_Release_Arrow_-_SFX_Producer.ogg
    defaultSpread: 10
  - type: RadiationSource
    intensity: 2
    slope: 3