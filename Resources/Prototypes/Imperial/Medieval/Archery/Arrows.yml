# Existing cartridge-based arrows.
# These are unchanged for now.

- type: entity
  parent: BaseCartridge
  id: MedievalArrowSteel
  name: MedievalArrow
  components:
  - type: Tag
    tags:
    - Cartridge
    - Arrow
  - type: CartridgeAmmo
    proto: MedievalArrowBulletSteel
  - type: Sprite
    sprite: Imperial/Medieval/Gun/arrow.rsi
    rotation: -135
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Item
    size: Small


