- type: entity
  id: BasePoiseArrow
  parent: BaseArrow
  abstract: true
  components:
  - type: RDWeight
    value: 0.05
  - type: Projectile
    damage:
      types:
        Piercing: 5
  - type: PoiseArchery
    damageType: Piercing
    fixedDamage: 10
    damageMultiplier: 1
    bluntMultiplier: 0.25
    minPoiseMultiplier: 1
    maxPoiseMultiplier: 1

# Normal arrow.
- type: entity
  id: MedievalArrowIronPhysics
  parent: BasePoiseArrow
  name: arrow
  components:
  - type: Sprite
    layers:
    - state: tail
      color: red
    - state: rod
      color: brown
    - state: tip
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: MedievalSoundOnInteract
    onPick:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_pickup1.ogg
      params:
        variation: 0.2
    onPut:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_put1.ogg
      params:
        variation: 0.2


# Broadhead arrow.
- type: entity
  id: MedievalArrowSteelPhysics
  parent: BasePoiseArrow
  name: broadhead arrow
  components:
  - type: Sprite
    layers:
    - state: tail
      color: red
    - state: rod
      color: brown
    - state: tip
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: PoiseArchery
    damageType: Slash
    minPoiseMultiplier: 0.75
    maxPoiseMultiplier: 1

- type: entity
  id: MedievalArrowNeedlePhysics
  parent: BasePoiseArrow
  name: needle arrow
  description: A narrow steel-tipped arrow designed to pierce armor.
  components:
  - type: Sprite
    layers:
    - state: tail
      color: gray
    - state: rod
      color: brown
    - state: tip
      color: silver
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Projectile
    damage:
      types:
        Piercing: 5
  - type: APDamageOnHit
    damage:
      types:
        Piercing: 6
    respectPoise: true
  - type: PoiseArchery
    damageType: Piercing
    fixedDamage: 5
    damageMultiplier: 0.4
    bluntMultiplier: 0.1
    minPoiseMultiplier: 0.3
    maxPoiseMultiplier: 0.3
  - type: MedievalSoundOnInteract
    onPick:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_pickup1.ogg
      params:
        variation: 0.2
    onPut:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_put1.ogg
      params:
        variation: 0.2

- type: entity
  id: MedievalArrowPayloadPhysics
  parent: BasePoiseArrow
  name: Hollow arrow
  description: A specialized arrow fitted with a reinforced 5u vial for delivering harmful chemical payloads.
  components:
  - type: Sprite
    layers:
    - state: tail
      color: gray
    - state: rod
      color: brown
    - state: tip
      color: silver
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Projectile
    damage:
      types:
        Piercing: 2
  - type: PoiseArchery
    damageType: Piercing
    fixedDamage: 2
    damageMultiplier: 0.2
    bluntMultiplier: 0
    minPoiseMultiplier: 0.1
    maxPoiseMultiplier: 0.1
  - type: PayloadArrow
  - type: ItemSlots
    slots:
      payload:
        name: Payload vial
        startingItem: MedievalChemistryVialTempering
        whitelist:
          tags:
          - MedievalPayloadVial
  - type: MedievalSoundOnInteract
    onPick:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_pickup1.ogg
      params:
        variation: 0.2
    onPut:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_put1.ogg
      params:
        variation: 0.2

- type: entity
  id: MedievalArrowDualChamberPhysics
  parent: BasePoiseArrow
  name: dual-chamber arrow
  description: A delicate glass arrow containing two isolated chemical chambers.
  components:
  - type: Sprite
    layers:
    - state: tail
      color: gray
    - state: rod
      color: brown
    - state: tip
      color: silver
  - type: Projectile
    damage:
      types:
        Blunt: 2
  - type: PoiseArchery
    damageType: Blunt
    fixedDamage: 2
    damageMultiplier: 0.1
    bluntMultiplier: 0
    minPoiseMultiplier: 0.1
    maxPoiseMultiplier: 0.1
  - type: DualChamberArrow
    breakSound:
      collection: GlassBreak
      params:
        volume: -4
  - type: SolutionContainerManager
    solutions:
      reaction:
        maxVol: 10
  - type: ItemSlots
    slots:
      chamber1:
        name: Chamber 1
        startingItem: MedievalDualChamberArrowVial
        disableEject: true
        locked: true
      chamber2:
        name: Chamber 2
        startingItem: MedievalDualChamberArrowVial
        disableEject: true
        locked: true
  - type: MedievalSoundOnInteract
    onPick:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_pickup1.ogg
      params:
        variation: 0.2
    onPut:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_put1.ogg
      params:
        variation: 0.2
