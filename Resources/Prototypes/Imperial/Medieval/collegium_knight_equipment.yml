### SKill book for collegium knight and soilder.

- type: entity
  parent: BaseItem
  id: MedievalCollegiumArcaneKnightGrimoire
  name: Arcane Knight Grimoire
  description: A grimoire issued to Arcane Knights for studying physical and magical skills. It binds to its owner and its learning resources do not regenerate.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Misc/magic_book.rsi
    state: icon
  - type: Item
    sprite: Imperial/Medieval/Misc/magic_book.rsi
  - type: Undrowable
  - type: UserInterface
    interfaces:
      enum.ImperialStoreUiKey.Key:
        type: ImperialStoreBoundUserInterface
  - type: ActivatableUI
    key: enum.ImperialStoreUiKey.Key
  - type: BindStoreOnEquip
  - type: ImperialStore
    name: medieval-store-name
    withdrawText: medieval-store-withdraw-button-text
    currencyTitle: medieval-collegium-skills-currency-title
    cannotAccessStoreText: medieval-store-cannot-access-text
    ownerOnly: true
    categories:
    - MedievalCollegiumPhysicalSkills
    - MedievalCollegiumMagicSkills
    currencyWhitelist:
    - MedievalSkillPoints
    - MedievalMagicTalent
    balance:
      # Placeholder amounts until the ability list is finalized.
      MedievalSkillPoints: 6
      MedievalMagicTalent: 6
    bonusCount: 0

