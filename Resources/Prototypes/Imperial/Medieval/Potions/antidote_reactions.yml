# Antidotes release a shared pool of medievalpoisonneutralizer into the bloodstream.
# Each unit consumes one unit of an eligible potion poison and produces two units of Water.
# Fractional reactions allow each 0.50u T1 release to react immediately when chemistry updates.
# Higher priorities run first: Caustic, Cold, Radiation, then Regular; strongest tier first.
# Agricultural chemicals and other medicines are intentionally excluded.

- type: reaction
  id: MedievalAntidoteNeutralizeCausticT3
  priority: 11
  quantized: false
  reactants:
    medievalpoisonneutralizer:
      amount: 1
    medievalbestacid:
      amount: 1
  products:
    Water: 2

