# Initial testing settings, not finalized balance:
# Radiation T1/T2/T3 lifetimes: 15/25/35 seconds.
# Explosive T1/T2 unshielded ranges: approximately 8/10 world units.
# Intensity 20 becomes 2 Radiation damage/sec through this branch's /10 conversion,
# before armor and other damage modifiers. It is NOT 20 health damage/sec.
# Slope scales with fractional strength along with intensity.
# Stock defaults: radiation.min_intensity = 0.1, radiation.gridcast.max_distance = 50.
# No Sprite, Physics or Fixtures: the field is invisible except for its red light.

- type: entity
  id: BaseMedievalAlchemyRadiationField
  abstract: true
  name: alchemical radiation field
  components:
  - type: RadiationSource
    intensity: 20
    slope: 2.5
  - type: PointLight
    color: Red
    energy: 1
    radius: 8
  - type: TimedDespawn
    lifetime: 15

