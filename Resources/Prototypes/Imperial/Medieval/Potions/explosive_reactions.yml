# Spellward Phase 4: static 1:1 explosive reactions and dedicated damage prototypes.
# Install alongside the preceding Phase 4 reagent, reaction-engine, cloud, fire,
# and shockwave files. Existing arrows use their normal mixing implementation.
#
# Initial test settings:
# T1 blast: current MedievalGrenade total intensity 60, slope 1, peak cap 4.
# T2 blast: total intensity 120, retaining slope 1 and peak cap 4.
# Radiation reference damage at intensity 4: 25 / 50 / 75 by poison tier.
# Actual blast damage follows stock intensity, propagation and resistance handling.
# Caustic/Cold payloads and status effects use the current potion values as a baseline.
# Cold damage coefficients are rounded to the engine's hundredth precision.
# Smoke: 1u Blind per full activation, 10s lifetime, stock gradual spreading.
# Foam: 20u matching poison over 10s, giving a nominal 2u/s transfer rate per cloud.
# Cloud payloads scale by consumed units / 5; small values follow stock rounding.
# Smoke spread budgets target a broader footprint and need in-game tuning.
# Fire placement retains the approved fixed 5-tile T1 and 11-tile T3 patterns.
# The chemistry engine enforces a maximum 5u of each input and one-second spacing.

