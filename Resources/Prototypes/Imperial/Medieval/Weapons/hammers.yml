- type: entity
  name: iron hammer
  parent: [ BaseItem, BaseTwoHandedCharged, BasePoiseTwoHanded ]
  id: MedievalIronHammer
  description: A medieval hammer.
  components:
  - type: PoiseDamage
    poiseDamage: 25
  - type: RDWeight
    value: 11
  - type: QuestItem
    contractName: "любое двуручное оружие"
  - type: EmitSoundOnLand
    sound:
      collection: MedievalIronDrop
      params:
          variation: 0.02
          volume: 1
  - type: Tag
    tags:
    - FireAxe
  - type: Sprite
    sprite: Imperial/Medieval/Melee/hammer.rsi
    state: icon
  - type: MeleeParry
    parryChanse: 0.6
  - type: MeleeWeapon
    clickDamageModifier: 1.8
    wideAnimationRotation: -140
    attackRate: 0.15
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: true
    angle: 120
    cPAnimationOffset: 1
    range: 1.8
    damage:
      types:
        Blunt: 12
        Structural: 56
        ParryAble: 1
  - type: MedievalMeleeResource
    resourceWaste: 0.7
    safeToHitGroup: structure
  - type: Wieldable
    useDelayOnWield: false
    #wieldTime: 3.5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 17
        Structural: 50
  - type: Item
    size: Huge
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 12
  - type: MeleeRequiresWield
  #- type: QualityOfItem
  #  qualityWeights:
  #    0: 0
  #    1: 0
  #    2: 0
  #    3: 10
  #    4: 0
  #    5: 0
  #    6: 0
  - type: MeleeThrowOnHit
    distance: 2.3
    speed: 5
  - type: StaminaDamageOnHit
    damage: 18 #2 dagger, 5 spear, 4 sword, 5 mace, 8 halberd, 6 sekir, 18 hammer
  - type: Meltable
    resourceCount: 7
  - type: HeldSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8

