- type: entity
  name: medieval spear
  parent: [ BaseItem, BaseSpearCharged, BasePoiseSpear ]
  id: MedievalSpearCult
  description: Definition of a Classic. Keeping murder affordable since 200,000 BCE.
  components:
  - type: PoiseDamage
    poiseDamage: 8
  - type: QuestItem
    contractName: "любое двуручное оружие"
  - type: Sharp
  - type: Sprite
    sprite: Imperial/Medieval/Melee/cult_spear.rsi
    netsync: false
    state: spear
  - type: MeleeParry
    parryChanse: 0.6
  - type: MeleeWeapon
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: true
    cPAnimationOffset: 2
    clickDamageModifier: 1.32
    wideAnimationRotation: -140
    attackRate: 1
    range: 2.75
    damage:
      types:
        Piercing: 11
        ParryAble: 1
    angle: 0
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    soundSwing:
      path: /Audio/Imperial/Medieval/spear_swing.ogg
  - type: MedievalMeleeResource
    resourceWaste: 0.75
  - type: Item
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Wieldable
    #wieldTime: 0.5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 13
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 21
  #- type: EmbeddableProjectile
    #offset: 0.15,0.15
  - type: ThrowingAngle
    angle: 225
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: MeleeThrowOnHit
    distance: 0.6
    speed: 5
  - type: StaminaDamageOnHit
    damage: 5 #2 dagger, 5 spear, 4 sword, 5 mace, 8 halberd, 6 sekir, 18 hammer
  - type: CurseItem
    cult: true

