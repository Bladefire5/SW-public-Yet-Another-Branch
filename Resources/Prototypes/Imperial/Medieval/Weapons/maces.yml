- type: entity
  name: mace
  parent: [ BaseItem, BaseCrushingLightCharged, BasePoiseBluntLight ]
  id: MedievalMaceT3
  description: An ancient war blade.
  components:
  - type: RDWeight
    value: 2
  - type: QuestItem
    contractName: "любое дробящее одноручное оружие"
  - type: EmitSoundOnLand
    sound:
      collection: MedievalIronDrop
      params:
          variation: 0.02
          volume: 1
  # - type: Sharp
  - type: Sprite
    sprite: Imperial/Medieval/Melee/iron_mace.rsi
    state: icon
  - type: MeleeParry
    parryChanse: 0.1
  - type: MeleeWeapon
    clickDamageModifier: 1.26
    wideAnimationRotation: -140
    attackRate: 0.8
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: true
    cPAnimationOffset: 1
    damage:
      types:
        Blunt: 7
        Piercing: 5
        ParryAble: 1
    resetOnHandSelected: false
  - type: Item
    size: Normal
  - type: DisarmMalus
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  #- type: QualityOfItem
  #  qualityWeights:
  #    0: 0
  #    1: 0
  #    2: 0
  #    3: 10
  #    4: 0
  #    5: 0
  #    6: 0
  - type: Clothing
    sprite: Imperial/Medieval/Melee/iron_mace.rsi
    slots:
    - back
    - suitStorage
    - belt
    quickEquip: false
  - type: MeleeThrowOnHit
    distance: 0.3
    speed: 5
  - type: StaminaDamageOnHit
    damage: 2 #2 dagger, 5 spear, 4 sword, 5 mace, 8 halberd, 6 sekir, 18 hammer
  - type: Meltable
    resourceCount: 3

